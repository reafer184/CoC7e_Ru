name: Уличный торговец
type: occupation
img: icons/svg/ice-aura.svg
system:
  source: FoundryVTT CoC7
  description:
    value: '<p>Уличные торговцы — их также называют разносчиками и лоточниками — кочуют с места на место, обычно с тележкой или лотком, и продают прохожим всякую мелочь: изделия ручной работы, еду и закуски или другие недорогие товары. Они славятся тем, что выкрикивают названия своих товаров, зазывая покупателей, а острым словом и болтовнёй умеют поднять цену и продать больше.</p><p>Целый день на улице означает, что торговец знает разные районы, привычки и перемещения местных жителей и служит магнитом для сплетен — а нередко и их источником.</p><p><strong>Возможные связи:</strong> другие торговцы, местные полицейские, поставщики товара, дворецкие и прочая домашняя прислуга.</p>'
