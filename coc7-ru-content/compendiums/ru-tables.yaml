name: Таблица приступов безумия (в реальном времени)
formula: 1d10
results:
- type: text
  name: Амнезия
  description: Сыщик не помнит ничего из того, что произошло с момента, когда он последний раз находился в безопасном месте. Ему кажется, что мгновение назад он завтракал, а теперь стоит лицом к лицу с чудовищем. Длится [[/r 1D10]] раундов.
- type: text
  name: Психосоматическое расстройство
  description: Сыщик на [[/r 1D10]] раундов теряет зрение, слух или способность владеть одной из конечностей — без физической причины.
- type: text
  name: Вспышка ярости
  description: Багровая пелена ярости застилает сыщику глаза, и он на [[/r 1D10]] раундов срывается в неуправляемое буйство, обрушивая его на всё вокруг — и на врагов, и на союзников.
- type: text
  name: Паранойя
  description: На [[/r 1D10]] раундов сыщика охватывает тяжёлая паранойя. Все против него! Никому нельзя верить! За ним следят, его уже предали, а всё, что он видит, — обман.
- type: text
  name: Значимый человек
  description: Обратитесь к разделу предыстории «Значимые люди». Сыщик принимает кого-то из присутствующих за своего значимого человека и действует, исходя из характера этих отношений. Длится [[/r 1D10]] раундов.
- type: text
  name: Обморок
  description: Сыщик теряет сознание и приходит в себя через [[/r 1D10]] раундов.
- type: text
  name: Паническое бегство
  description: Сыщик стремится оказаться как можно дальше отсюда любым доступным способом — даже если для этого придётся забрать единственную машину и бросить остальных. Бежит [[/r 1D10]] раундов.
- type: text
  name: Истерика или эмоциональный срыв
  description: 'Сыщик не способен действовать: он хохочет, рыдает, кричит и так далее — [[/r 1D10]] раундов.'
- type: text
  name: Фобия
  description: Сыщик приобретает новую фобию — например, клаустрофобию (боязнь замкнутых пространств), демонофобию (боязнь духов и демонов) или катсаридафобию (боязнь тараканов). Даже если источника страха рядом нет, следующие [[/r 1D10]] раундов сыщику кажется, что он здесь, и все его действия получают штрафную кость до конца приступа.
- type: text
  name: Мания
  description: Сыщик приобретает новую манию — например, аблутоманию (тягу к постоянному мытью), псевдоманию (неудержимую тягу ко лжи) или гельминтоманию (болезненную любовь к червям). Следующие [[/r 1D10]] раундов сыщик стремится ей потворствовать, и все его действия получают штрафную кость до конца приступа.
flags:
  CoC7:
    cocidFlag:
      id: rt..bouts-of-madness-table-realtime
      lang: ru
      priority: 0
