name: Мировоззрение и убеждения
img: icons/svg/d20-grey.svg
description: Русскоязычная таблица модуля coc7-ru-content для шага «Предыстория» мастера создания сыщика.
formula: 1d10
results:
- type: text
  img: icons/svg/d20-black.svg
  name: Вера
  description: Сыщик искренне верует и не пропускает ни одной службы; вера объясняет ему всё, что происходит в мире.
- type: text
  img: icons/svg/d20-black.svg
  name: Наука
  description: Только то, что можно измерить и проверить, достойно доверия. Суеверия — удел слабых умов.
- type: text
  img: icons/svg/d20-black.svg
  name: Судьба
  description: Всё предначертано заранее. Спорить с судьбой бессмысленно, остаётся лишь достойно сыграть свою роль.
- type: text
  img: icons/svg/d20-black.svg
  name: Деньги
  description: Деньги решают всё. Достаточно узнать цену человека — и станет ясно, чего он стоит.
- type: text
  img: icons/svg/d20-black.svg
  name: Политика
  description: Сыщик горячо привержен своим политическим взглядам и не молчит о них в обществе.
- type: text
  img: icons/svg/d20-black.svg
  name: Человечность
  description: Люди в глубине души добры; жестокость — следствие обстоятельств, а не природы.
- type: text
  img: icons/svg/d20-black.svg
  name: Мизантропия
  description: Люди — стая зверей в приличной одежде. Доверять можно единицам.
- type: text
  img: icons/svg/d20-black.svg
  name: Тайное знание
  description: Мир скрывает истину, и сыщик убеждён, что однажды доберётся до неё.
- type: text
  img: icons/svg/d20-black.svg
  name: Долг
  description: Слово дано — слово держат. Обязательства перед семьёй, страной или делом важнее личных желаний.
- type: text
  img: icons/svg/d20-black.svg
  name: Суеверия
  description: Разбитое зеркало, чёрная кошка, тринадцатый номер — сыщик соблюдает свои приметы неукоснительно.
flags:
  CoC7:
    cocidFlag:
      id: rt..backstory-ideology-and-beliefs
      lang: ru
      priority: 0
